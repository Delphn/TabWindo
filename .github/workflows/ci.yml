# Builds, tests and lints every pull request and every push to main. It needs no secrets: signing and
# notarization happen only on the maintainer's Mac, with release.sh. Changes to the website alone skip it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: [site/**]
  pull_request:
    paths-ignore: [site/**]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, lint
    # The oldest Xcode TabWindo supports, so this also proves "Xcode 26 or later" in the README.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint
        run: xcrun swift format lint --strict --recursive Sources Tests Package.swift

      - name: App icon
        run: |
          out="$RUNNER_TEMP/icon"
          mkdir -p "$out"
          xcrun actool AppIcon.icon --compile "$out" --platform macosx --minimum-deployment-target 26.0 \
            --app-icon AppIcon --output-partial-info-plist "$out/Info.plist"
          # actool reports success even when it fails, so check for its output.
          test -s "$out/AppIcon.icns" && test -s "$out/Assets.car"

      - name: Info.plist
        run: plutil -lint Info.plist
