name: Feature request
description: An idea that makes switching windows better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TabWindo does one thing: switch between windows, fast and privately. Ideas that make that better are
        welcome. Ideas that take it beyond that, like launching apps or arranging windows, are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's slow, hard or missing when you switch windows today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
